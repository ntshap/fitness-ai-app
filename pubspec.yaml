name: fitness_ai_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.2

  # Fonts
  google_fonts: ^4.0.4

  # UI & Charts
  fl_chart: ^0.66.2

  # Camera & Permissions
  camera: ^0.10.6
  permission_handler: ^11.4.0

  # AI & Image Processing
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  
  # Video & Gallery
  image_picker: ^1.1.2
  video_player: ^2.8.6
  image_gallery_saver: ^2.0.3

  # Video Processing & Frame Extraction
  video_thumbnail: ^0.5.3

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Authentication & Security
  shared_preferences: ^2.2.3
  crypto: ^3.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/movenet.tflite
